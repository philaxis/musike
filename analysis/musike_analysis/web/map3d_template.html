<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>음악 지도</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
// Musike 「음악 지도」 화면(/library/map) 안 iframe 에서만 쓴다(재생·메뉴는 Musike 쪽). 주소창으로 열면 그 화면으로 옮긴다.
if (window.parent === window) location.replace("/library/map" + location.hash);
</script>
<style>
:root{color-scheme:light;--bg:#fafaf9;--fg:#1c1d21;--mut:#6b7079;--card:rgba(255,255,255,.92);--solid:#fff;--line:#e3e5e9;--chip:#f1f2f4;--acc:#0b8a7c;--acc-ink:#fff;--play:#c27c0e;--fav:#e8457a;--shadow:0 8px 28px rgba(20,24,32,.10);--grey:#c9cdd3;--axis:#c3c7ce}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1014;--fg:#e6e7ea;--mut:#959aa4;--card:rgba(24,27,33,.92);--solid:#181b21;--line:#2a2e36;--chip:#232730;--acc:#5fd3c4;--acc-ink:#04201c;--play:#f0b35b;--fav:#ff6f9c;--shadow:0 8px 28px rgba(0,0,0,.45);--grey:#3a3f48;--axis:#4a505b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1014;--fg:#e6e7ea;--mut:#959aa4;--card:rgba(24,27,33,.92);--solid:#181b21;--line:#2a2e36;--chip:#232730;--acc:#5fd3c4;--acc-ink:#04201c;--play:#f0b35b;--fav:#ff6f9c;--shadow:0 8px 28px rgba(0,0,0,.45);--grey:#3a3f48;--axis:#4a505b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc)}
button,select,input{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}

/* 컨트롤: 왼쪽 위 카드 하나, 기본은 접힘(검색 + 버튼 둘) */
#ctl{position:fixed;left:16px;top:16px;z-index:20;width:400px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px}
#top .brand{flex:1}  /* 첫 줄: 이름 + 버튼들, 둘째 줄: 검색창 전체 폭 */
#top .brand{font-weight:700;font-size:15px;padding:0 4px 0 6px;white-space:nowrap;letter-spacing:-.01em}
#q{order:9;flex:1 1 100%;min-width:0;border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:7px 10px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc)}
.ib{flex:none;width:34px;height:34px;border:1px solid transparent;background:none;border-radius:9px;cursor:pointer;display:grid;place-items:center;color:var(--mut)}
.ib:hover{background:var(--chip);color:var(--fg)}
.ib.on{color:var(--acc);background:var(--chip)}
.ib svg{width:18px;height:18px}
#more{display:none;border-top:1px solid var(--line);padding:12px 14px 14px;max-height:calc(100vh - 90px);overflow:auto}
#ctl.open #more{display:block}
.sec{margin-bottom:14px}
.sec:last-child{margin-bottom:0}
.sec>h4{margin:0 0 7px;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.02em}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button,.chipbtn{border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on,.chipbtn.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.seg.big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.big button{min-height:42px;padding:8px 6px;border-radius:10px;font-size:13px;white-space:nowrap}
.seg.sizes button{padding:6px 14px}
select.sel{width:100%;min-height:36px;border:1px solid var(--line);background:var(--solid);border-radius:9px;padding:6px 8px;font-size:13px}
#adv{border-top:1px solid var(--line);padding-top:10px;margin-bottom:0}
#adv>summary{font-size:13px;font-weight:600;color:var(--mut);padding:2px 0 8px}
#adv .advbody{padding-top:2px}
#adv .sec:last-child{margin-bottom:0}
.axes{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center}
.axes label{font-size:12px;color:var(--mut)}
.axes select{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 6px;font-size:13px}
.axes .miss{grid-column:2;margin-top:-4px;font-size:11px;color:var(--mut)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn.on{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
details{border-top:1px solid var(--line);padding-top:10px;margin-bottom:12px}
details summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--mut);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ ";}
.fgrp{margin-top:9px}
.fgrp b{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-bottom:4px}
.fgrp .seg button{padding:2px 9px;font-size:12px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.links a{text-decoration:none}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
.hint .ph{display:none}

/* 검색 결과(search.js): 검색창 아래 붙은 카드 목록. 접으면 '결과 N개' 한 줄 */
#results{position:fixed;left:16px;top:var(--below,66px);width:min(480px,calc(100% - 32px));max-height:min(70vh,640px);z-index:25;background:var(--solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
#results.on{display:flex}
#results .sbar{flex:none;display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;cursor:pointer;text-align:left;font-size:13px;border-bottom:1px solid var(--line)}
#results .sbar:hover{background:var(--chip)}
#results .shead{flex:none;display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
#results .shead .sbar{flex:1;min-width:0;border-bottom:0}
#results .spin{flex:none;margin:6px 8px 6px 0;border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:0 10px;font-size:12px;cursor:pointer;color:var(--fg);white-space:nowrap}
#results .spin:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#results .spin.on{border-color:var(--acc);color:var(--acc);cursor:default}
#results.fold .shead{border-bottom:0}
#results .rtg{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#results .sbar b{font-weight:700;white-space:nowrap}
#results .sst{flex:1;min-width:0;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .sst.ld::before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#results .sfold{flex:none;color:var(--mut);font-size:12px;display:flex;align-items:center;gap:4px}
#results .sfold i{font-style:normal;display:inline-block;transition:transform .15s}
#results.fold .sfold i{transform:rotate(180deg)}
#results.fold .sbar{border-bottom:0}
#results.fold .slist{display:none}
#results .slist{overflow:auto;padding:4px;overscroll-behavior:contain}
#results .snone{padding:14px 10px;color:var(--mut);font-size:13px}
#results .rr{display:flex;gap:9px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#results .rr:hover,#results .rr.act{background:var(--chip)}
#results .rr.cur{border-color:var(--acc);background:var(--chip)}
#results .rr.cur .rk{color:var(--acc);font-weight:700}
#results .rk{flex:none;width:18px;text-align:right;color:var(--mut);font-size:12px;padding-top:1px}
#results .sdiv{padding:10px 10px 2px;font-size:11px;color:var(--mut)}
#results .rr.ch .rk{font-size:10px;letter-spacing:.02em}
#results .rm{flex:1;min-width:0}
#results .rt{font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .ra{color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#results .rs{color:var(--mut);font-size:12px;line-height:1.4;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#results .rf{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11px}
#results .rkind{border-radius:999px;padding:0 7px;background:var(--chip);color:var(--mut)}
#results .rkind.sem{color:#2c6e9e}
#results .rkind.both{color:var(--acc)}
.sbadge{display:inline-block;vertical-align:middle;margin-left:6px;padding:0 7px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--mut);font-size:11px;font-weight:500;line-height:18px;white-space:nowrap}
#results .rsc{color:var(--mut);font-variant-numeric:tabular-nums}

/* 최근 검색(빈 검색창에 포커스) */
#results .rch{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}
#results .rch b{color:var(--fg);font-size:13px;font-weight:600}
#results .rca{margin-left:auto;border:0;background:none;color:var(--mut);font-size:12px;cursor:pointer;padding:4px 6px;border-radius:6px}
#results .rca:hover{background:var(--chip);color:var(--fg)}
#results .rc{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#results .rc:hover,#results .rc.act{background:var(--chip)}
#results .rci{flex:none;width:16px;height:16px;color:var(--mut)}
#results .rci svg{width:16px;height:16px;display:block}
#results .rct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .rcx{flex:none;width:26px;height:26px;border:0;border-radius:7px;background:none;color:var(--mut);font-size:16px;cursor:pointer;line-height:1}
#results .rcx:hover{background:var(--line);color:var(--fg)}

/* 정보 패널 */
#panel{position:fixed;top:16px;right:16px;bottom:16px;width:380px;z-index:30;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;padding:16px 18px 24px;transform:translateX(calc(100% + 24px));transition:transform .22s ease;overscroll-behavior:contain}
#panel.open{transform:none}
#panel .grab{display:none}
#panel .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;background:none;color:var(--mut);font-size:20px;cursor:pointer;border-radius:8px}
#panel .x:hover{background:var(--chip)}
#panel .drive{display:block;text-align:center;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:600;padding:11px;border-radius:10px;margin:26px 0 16px}
#panel h2{font-size:19px;margin:0 0 4px;line-height:1.35;letter-spacing:-.01em}
#panel .au{color:var(--mut);margin-bottom:10px}
#panel .chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
#panel .chip{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip)}
#panel .chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
#panel p{margin:10px 0;line-height:1.6}
#panel h3{font-size:12px;color:var(--mut);margin:20px 0 6px;font-weight:600;letter-spacing:.02em}
#panel .score{display:grid;grid-template-columns:72px 1fr 18px;gap:8px;align-items:center;font-size:12px;margin:5px 0}
#panel .score i{display:block;height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
#panel .score i b{display:block;height:100%;background:var(--acc)}
#panel .score small{grid-column:2;margin-top:-5px;color:var(--mut);display:flex;justify-content:space-between;font-size:11px}
#panel ul{margin:0;padding:0;list-style:none}
#panel li{padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
#panel li:last-child{border-bottom:0}
#panel li.nb{cursor:pointer;display:flex;gap:8px;align-items:center}
#panel li.nb:hover span{color:var(--acc)}
#panel li.nb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel li.nb em{font-style:normal;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#panel li.nb .dot{width:8px;height:8px;border-radius:50%;flex:none}
#panel li a{text-decoration:none}
#panel .mut{color:var(--mut)}
#panel .pt li{padding:8px 0}
#panel .pt .ph{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
#panel .pt .pn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .pt .pw{margin-left:auto;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
#panel .pt .pb{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
#panel .pt .pb b{display:block;height:100%;background:var(--acc);border-radius:3px}
#panel .pt .ch{color:var(--mut);font-size:11px;line-height:1.45;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 정보 패널 위: 지나온 곡(뒤로/앞으로 · 빵부스러기) */
#panel .navh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 4px}
#panel .nvb{flex:none;width:30px;height:30px;border:1px solid var(--line);background:var(--solid);border-radius:8px;cursor:pointer;color:var(--fg);font-size:15px;line-height:1;display:grid;place-items:center}
#panel .nvb:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
#panel .nvb:disabled{opacity:.35;cursor:default}
#panel .nvc{flex:none;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;margin-right:2px}
#panel .navt{flex:1 1 100%;display:flex;align-items:center;gap:2px;min-width:0;font-size:12px;color:var(--mut);overflow:hidden;white-space:nowrap;margin-bottom:8px}
#panel .navt .crm{flex:0 1 auto;min-width:0;max-width:96px;border:0;background:none;padding:2px 4px;font-size:12px;color:var(--mut);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:5px}
#panel .navt .crm:hover{background:var(--chip);color:var(--fg)}
#panel .navt .crm.on{color:var(--acc);font-weight:600}
#panel .navt .sep{flex:none;color:var(--line)}

/* 이름표·툴팁·범례·상태 */
.lbl{position:fixed;z-index:12;pointer-events:none;font-size:12px;color:var(--fg);background:var(--card);padding:1px 6px;border-radius:5px;white-space:nowrap;transform:translate(9px,-50%);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.lbl.sel{font-weight:800;font-size:13px;color:var(--acc-ink);background:var(--acc);box-shadow:0 2px 12px rgba(0,0,0,.28);z-index:13;padding:2px 8px;border-radius:7px}
.lbl.grp{transform:translate(-50%,-50%);font-weight:700;font-size:13px;color:var(--mut);background:none;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);letter-spacing:-.01em}
.lbl.amb{font-size:11px;max-width:170px;opacity:.85}
.lbl.hov{box-shadow:0 0 0 1px var(--acc);background:var(--solid);opacity:1}
.axl{position:fixed;z-index:11;pointer-events:none;font-size:12px;color:var(--mut);white-space:nowrap;transform:translate(-50%,-50%)}
.axl b{color:var(--fg);font-weight:600}
#tip{position:fixed;z-index:40;pointer-events:none;background:var(--solid);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);padding:5px 9px;border-radius:8px;font-size:13px;max-width:340px;display:none}
#tip small{display:block;color:var(--mut);font-size:12px}
#tip b,#tip small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tip b{display:block;font-weight:600}
#legend{position:fixed;left:16px;bottom:16px;z-index:15;font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:min(52vw,460px);max-height:30vh;overflow:auto;line-height:1.9}
#legend .it{white-space:nowrap;margin-right:10px;display:inline-block}
#legend .it i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-.5px}
#legend .ramp{display:flex;align-items:center;gap:8px}
#legend .ramp i{display:block;width:140px;height:8px;border-radius:4px}
#status{position:fixed;right:16px;bottom:16px;z-index:15;font-size:12px;color:var(--mut);pointer-events:none;text-align:right}
#edge{position:fixed;z-index:14;display:none;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:var(--acc);color:var(--acc-ink);box-shadow:var(--shadow),0 0 0 3px color-mix(in srgb,var(--bg) 70%,transparent);cursor:pointer;place-items:center;transform:translate(-50%,-50%)}
#edge.on{display:grid}
#edge svg{width:24px;height:24px;transform:rotate(var(--a,0deg))}
#edge:hover{filter:brightness(1.06)}
#legend .lt{display:inline-flex;align-items:center;border:0;background:none;padding:0 4px 0 0;color:var(--mut);font-size:12px;cursor:pointer}
#legend.fold{padding:2px 8px}
#legend.fold .lb{display:none}

/* 조건 버블(필터 칩): 검색창 아래 줄. 폰은 하단 카드 위 가로 스크롤 한 줄 */
#chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:0 8px 8px}
#chips .bub{display:inline-flex;align-items:center;gap:2px;max-width:100%;border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,var(--solid));color:var(--fg);border-radius:999px;padding:0 2px 0 10px;font-size:12px;font-weight:600;line-height:26px;white-space:nowrap}
#chips .bub>span{overflow:hidden;text-overflow:ellipsis}
#chips .bub .bx{flex:none;width:24px;height:24px;border:0;background:none;border-radius:50%;cursor:pointer;color:var(--mut);font-size:14px;line-height:1;display:grid;place-items:center}
#chips .bub .bx:hover{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--fg)}
#chips .bub select{flex:none;max-width:76px;border:0;background:none;color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;padding:0 2px}
#chips .cnt{font-size:12px;color:var(--mut);white-space:nowrap;margin-left:2px}
#chips .cnt b{color:var(--fg);font-variant-numeric:tabular-nums}
#chips .clr,#chips .add{border:1px dashed var(--line);background:none;border-radius:999px;padding:0 10px;font-size:12px;line-height:26px;cursor:pointer;color:var(--mut);white-space:nowrap}
#chips .add{border-style:solid;color:var(--fg)}
#chips .clr:hover,#chips .add:hover{border-color:var(--acc);color:var(--acc)}
.ib.tagb{font-weight:800;font-size:17px}
#chips .cnt.all{margin-left:0}

/* 되돌리기 토스트: 버블을 지우면 몇 초간(Ctrl+Z 도 됨) */
#undo{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:70;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:6px 6px 6px 14px;background:var(--fg);color:var(--bg);border-radius:12px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#undo.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#undo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#undo button{flex:none;border:0;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
#undo kbd{font:500 10.5px/1 ui-monospace,monospace;opacity:.7;margin-left:4px}

/* 명령 팔레트(Ctrl+K · ⌘ 버튼): 보는 방식·조건 더하기·개인 기능을 글자(초성 포함)로 찾는다 */
.ib.cmdk{width:auto;padding:0 8px;gap:4px;display:flex;border-color:var(--line);background:var(--solid);color:var(--fg);font-size:12.5px;font-weight:600}
.ib.cmdk kbd{font:500 10.5px/1 ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:2px 3px;background:var(--chip)}
.ib.cmdk:hover{border-color:var(--acc)}
#pal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.07);display:flex;justify-content:center;align-items:flex-start;padding-top:min(12vh,110px)}
#pal[hidden]{display:none}
.pd-pal{width:min(600px,calc(100% - 32px));max-height:min(70vh,620px);background:var(--solid);color:var(--fg);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.pd-in{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.pd-in>svg{width:19px;height:19px;color:var(--mut);flex:none}
.pd-in input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:16px;color:var(--fg)}
.pd-esc{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--mut);cursor:pointer}
.pd-esc kbd{font:inherit}
.pd-esc span{display:none}
.pd-crumb{padding:7px 16px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.pd-crumb button{border:0;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--fg);margin-right:6px}
.pd-list{flex:1;overflow:auto;padding:6px;overscroll-behavior:contain}
.pd-gh{font-size:11px;font-weight:600;color:var(--mut);padding:8px 10px 4px;letter-spacing:.02em}
.pd-it{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:9px;padding:7px 10px;cursor:pointer;text-align:left;color:var(--fg)}
.pd-it.act{background:var(--chip)}
.pd-it .ic{flex:none;width:24px;text-align:center;color:var(--mut);font-size:14px}
.pd-it .tx{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px}
.pd-it .tx b{font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-it .tx small{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pd-it .rt{flex:none;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:2px}
.pd-it .rt i{display:inline-block;width:8px;height:8px;border-radius:50%}
.pd-it .rt .ramp{width:60px;height:7px;border-radius:4px}
.pd-it.on .tx b{color:var(--acc);font-weight:650}
.pd-it.on .ic{color:var(--acc)}
.pd-it.dis{opacity:.5}
.pd-none{padding:22px;text-align:center;color:var(--mut);font-size:13px}
.pd-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
.pd-foot kbd{font:500 10.5px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--chip);margin-right:3px}

/* 조건 더하기 메뉴 · 주제 태그 트리: 왼쪽 위 카드 아래(폰은 하단 시트) */
.fpane{position:fixed;left:16px;top:var(--below,66px);width:340px;max-height:calc(100vh - var(--below,66px) - 70px);z-index:27;background:var(--solid);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden;font-size:13px}
.fpane.open{display:flex}
.fpane .fh{flex:none;display:flex;align-items:center;gap:8px;padding:10px 8px 8px 14px;border-bottom:1px solid var(--line)}
.fpane .fh b{font-size:14px;flex:1}
.fpane .fx{width:32px;height:32px;border:0;background:none;font-size:20px;line-height:1;color:var(--mut);cursor:pointer;border-radius:8px}
.fpane .fx:hover{background:var(--chip)}
.fpane .fb{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px 12px 12px}
#addmenu .fgrp:first-child{margin-top:0}
#addmenu .seg button{padding:3px 10px;font-size:12px}
#addmenu .rng{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
#addmenu .rng select{border:1px solid var(--line);background:var(--solid);border-radius:7px;padding:3px 4px;font-size:12px}
#addmenu .fhint{font-size:11px;color:var(--mut);margin-top:3px}
#tags .tq{width:100%;border:1px solid var(--line);background:var(--solid);border-radius:8px;padding:6px 9px;font-size:13px;outline:none;margin-bottom:6px}
#tags .tq:focus{border-color:var(--acc)}
#tags .tr{display:flex;align-items:center;gap:2px;min-height:30px;padding-left:calc(var(--d,0) * 16px);border-radius:7px}
#tags .tr:hover{background:var(--chip)}
#tags .tr.on{box-shadow:inset 3px 0 0 var(--acc)}
#tags .tr.on .tn{color:var(--acc);font-weight:700}
#tags .tw{flex:none;width:24px;height:24px;border:0;background:none;color:var(--mut);cursor:pointer;border-radius:6px;font-size:11px}
#tags .tw.leaf{visibility:hidden}
#tags .tn{flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:4px 2px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tags .tc{flex:none;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;padding-right:8px}
#tags .tnone{color:var(--mut);font-size:12px;padding:10px 4px}
#tags .tfoot{flex:none;display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--mut)}
#tags .tfoot .btn{margin-left:auto}

/* 정보 패널·검색 결과의 주제 태그: 경로 마디마다 누르면 그 태그 버블 */
.ttag{display:inline-flex;align-items:center;font-size:12px;border-radius:999px;background:var(--chip);padding:0 8px;line-height:22px;white-space:nowrap}
.ttag button{border:0;background:none;padding:0 1px;font-size:12px;cursor:pointer;color:inherit}
.ttag button:hover{color:var(--acc);text-decoration:underline}
.ttag i{font-style:normal;color:var(--mut);padding:0 1px}
.ttag button.root{color:var(--mut)}
#panel .chip.gb{border:0;cursor:pointer;font:inherit;font-size:12px}
#panel .chip.gb:hover{color:var(--acc)}
#panel h3 .h3b{float:right;border:1px solid var(--line);background:var(--solid);border-radius:999px;font-size:11px;padding:0 8px;line-height:20px;cursor:pointer;color:var(--fg);font-weight:500}
#panel h3 .h3b:hover{border-color:var(--acc);color:var(--acc)}

/* 터치: 점을 누르면 뜨는 작은 카드(곡 이름 + ♥·재생·상세) */
#card{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:28;width:min(520px,calc(100% - 20px));display:none;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
#card.open{display:flex}
#card .cm{flex:1;min-width:0}
#card .cm b,#card .cm small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .cm b{font-weight:650;line-height:1.35}
#card .cm small{color:var(--mut);font-size:12px}
#card .cb{flex:none;min-width:44px;min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--solid);border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:600;text-decoration:none;color:var(--fg);cursor:pointer}
#card .cb.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
#card .cb.bk{font-size:17px;padding:0 10px}
#card .cb[hidden]{display:none}
#card .cb[aria-disabled="true"]{opacity:.4;pointer-events:none}
#results .semon{display:block;width:calc(100% - 8px);margin:4px;min-height:44px;border:1px dashed var(--line);background:var(--chip);border-radius:9px;font-size:13px;cursor:pointer;color:var(--fg)}

/* 터치 기기: 누르는 곳 44px, 범례 접기, 노치 안전 영역 */
@media (pointer:coarse){
  button,a,select,input{touch-action:manipulation}
  #results .slist,#panel,#more,#legend{touch-action:pan-y}
  .ib{width:44px;height:44px}
  #q{min-height:40px;font-size:16px}  /* 16px 미만이면 iOS 가 입력할 때 확대한다 */
  .btn{min-height:44px;padding:5px 14px}
  .seg button,.chipbtn{min-height:38px;padding:4px 13px}
  .seg.big button{min-height:44px}
  .seg.sizes button{min-height:40px}
  select.sel{min-height:44px}
  #edge{width:50px;height:50px}
  .fgrp .seg button{min-height:36px;padding:2px 11px}
  .axes select{min-height:40px}
  #panel .x{width:44px;height:44px;top:4px;right:4px}
  #panel li.nb{min-height:44px}
  #panel .nvb{width:40px;height:40px}
  #results .rc{min-height:44px}
  #results .rcx{width:36px;height:36px}
  #results .sbar{min-height:44px}
  #results .rd{padding:6px 10px}
  #ctl{left:max(16px,env(safe-area-inset-left))}
  #panel{right:max(16px,env(safe-area-inset-right))}
  #chips .bub{line-height:34px}
  #chips .bub .bx{width:32px;height:32px}
  #chips .clr,#chips .add{line-height:34px}
  #tags .tr{min-height:40px}
  #tags .tw{width:36px;height:36px}
  #legend .lt{display:inline-flex;align-items:center;min-height:36px;border:0;background:none;padding:0 4px;color:var(--mut);font-size:12px;cursor:pointer}
  #legend.fold{padding:0 6px}
  #legend.fold .lb{display:none}
}

/* 폰: 컨트롤·정보 패널은 하단 시트 */
@media (max-width:720px){
  #ctl{left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));width:auto;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--solid)}  /* 블러는 fixed 자식(#more 시트)의 기준을 바꾼다 */
  #ctl #more{position:fixed;left:0;right:0;bottom:0;max-height:62vh;background:var(--solid);border:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(16px + env(safe-area-inset-bottom));z-index:35}
  #ctl #more::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
  #top .brand{display:none}
  #top{justify-content:flex-end}
  #results{left:10px;width:calc(100% - 20px);top:calc(62px + env(safe-area-inset-top));max-height:none}
  #results:not(.fold){top:auto;left:0;right:0;bottom:0;width:auto;max-height:60vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:36;padding-bottom:env(safe-area-inset-bottom)}
  #results:not(.fold)::before{content:"";display:block;flex:none;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  body.sopen #legend,body.sopen #status{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:56vh;border-radius:16px 16px 0 0;border-bottom:0;transform:translateY(105%);padding-top:6px}
  #panel.full{height:calc(100vh - 70px)}
  #panel .grab{display:block;width:100%;height:22px;border:0;background:none;cursor:pointer;padding:0}
  #panel .grab::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto}
  #panel .drive{margin-top:12px}
  #legend{left:10px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:calc(100% - 20px);max-height:18vh}
  body.sheet #legend,body.sheet #status{display:none}
  #status{right:10px;bottom:auto;top:calc(62px + env(safe-area-inset-top))}
  #panel{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  /* 키보드가 떠 있으면 결과를 아래 시트 대신 검색창 바로 밑에, 보이는 높이만큼 */
  body.kb #ctl{top:calc(var(--vvt,0px) + 10px)}
  /* 검색창·버블 줄 아래(--below) */
  body.kb #results:not(.fold){top:calc(var(--vvt,0px) + var(--below,62px));bottom:auto;left:10px;right:10px;max-height:calc(var(--vvh,100vh) - 70px);border-radius:12px;border-bottom:1px solid var(--line);padding-bottom:0}
  body.kb #results:not(.fold)::before{display:none}
  /* 팔레트도 키보드가 떠 있으면 아래 시트 대신 보이는 영역 위쪽에 */
  body.pkb #pal{align-items:flex-start;padding-top:calc(var(--vvt,0px) + 10px)}
  body.pkb .pd-pal{width:calc(100% - 20px);max-height:calc(var(--vvh,100vh) - 20px);border-radius:12px;border-bottom:1px solid var(--line);padding-bottom:0}
  body.pkb .pd-pal::before{display:none}
  /* 조건 버블: 검색 카드 안 둘째 줄(가로 스크롤). 아래 시트·카드에 가리지 않게 늘 위에 */
  #chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;overscroll-behavior:contain;padding-right:28px;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}  /* 오른쪽 끝 페이드 = 더 있음 */
  #chips::-webkit-scrollbar{display:none}
  #chips .bub,#chips .clr,#chips .cnt,#chips .add{flex:none}
  #chips .add{order:-1}
  #chips:not(:has(.bub)) .cnt.all{display:none}
  #results{top:var(--below,62px)}
  #status{top:var(--below,62px)}
  body:has(#results.on) #status,body:has(#chips .bub) #status{display:none}  /* 곡 수는 결과 바·버블 줄에 이미 있다 */
  .ib.cmdk span,.ib.cmdk kbd{display:none}
  .ib.cmdk{width:44px;justify-content:center;padding:0}
  #pal{padding-top:0;align-items:flex-end;background:rgba(10,12,16,.18)}
  .pd-pal{width:100%;max-height:min(78vh,calc(var(--vvh,100vh) - 40px));border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .pd-pal::before{content:"";display:block;flex:none;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
  .pd-foot{display:none}
  #results .sfold{font-size:0}  /* "접기/펼치기" 글자는 빼고 ⌃ 만 */
  #results .sfold i{font-size:14px}
  .hint .pc{display:none}
  .hint .ph{display:inline}
  .pd-esc kbd{display:none}
  .pd-esc span{display:inline}
  .pd-esc{min-width:44px;min-height:40px;font-size:13px;padding:0 10px;border-radius:9px}
  .pd-it{min-height:48px}
  .pd-it .tx{flex-direction:column;gap:0;align-items:flex-start}
  .pd-it .tx b{max-width:100%}
  #undo{bottom:calc(84px + env(safe-area-inset-bottom))}
  .fpane{left:0;right:0;top:auto;bottom:0;width:auto;max-height:66vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:37;padding-bottom:env(safe-area-inset-bottom)}
  .fpane::before{content:"";display:block;flex:none;width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
}
/* ---------------- 음악 전용 ---------------- */
.fpane .fb{overflow-x:hidden}
#addmenu .seg button{max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* 정보 패널 머리: 썸네일(누르면 재생)·재생/유튜브 버튼 */
#panel .pthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;margin:4px 0 10px;border-radius:10px;overflow:hidden;background:var(--chip);cursor:pointer}
#panel .pthumb img{width:100%;height:100%;object-fit:cover;display:block}
#panel .pthumb i{position:absolute;left:10px;bottom:10px;font-style:normal;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
#panel .pthumb i.on{background:var(--play);color:#1a1206}
#panel .pbtns{display:flex;gap:8px;margin:0 0 14px}
#panel .pbtns .pp{flex:1;border:0;background:var(--acc);color:var(--acc-ink);font-weight:650;padding:10px;border-radius:10px;cursor:pointer}
#panel .pbtns .pp.on{background:var(--play);color:#1a1206}
#panel .pbtns .more{flex:none;min-width:48px;display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--solid);color:var(--fg);font-size:18px;line-height:1;cursor:pointer}
#panel .pbtns .more:hover{border-color:var(--acc);color:var(--acc)}
#panel .chip.cb2{border:0;cursor:pointer;font:inherit;font-size:12px;color:inherit}
#panel .chip.cb2:hover{color:var(--acc)}
#panel .chip.snd{background:color-mix(in srgb,#8a6cff 14%,var(--chip))}
#panel .chip.pl{background:color-mix(in srgb,var(--play) 14%,var(--chip))}
#panel .score small{grid-column:2}
#panel dl.meta{display:grid;grid-template-columns:56px 1fr;gap:3px 10px;font-size:13px;margin:10px 0}
#panel dl.meta dt{color:var(--mut)}
#panel dl.meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
#panel li.nb small{color:var(--mut);margin-left:6px;font-size:12px}
#panel li.nb.now span{color:var(--play);font-weight:600}
#results .rr.snd .rk{font-size:10px;letter-spacing:.02em;color:#8a6cff}
#results .rwhy{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
#results .rwhy span{font-size:11px;border-radius:999px;padding:0 7px;line-height:20px;background:color-mix(in srgb,#8a6cff 14%,var(--chip));color:var(--fg)}
#results .rtg button{border:0;background:var(--chip);border-radius:999px;padding:0 8px;font-size:11px;line-height:20px;cursor:pointer;color:var(--fg)}
#results .rtg button:hover{color:var(--acc)}
#tags .tsec{font-size:11px;font-weight:700;color:var(--mut);padding:10px 4px 4px;letter-spacing:.02em}
#card .cb.more{font-size:18px;padding:0 10px}
#card .cb.play.on{background:var(--play);border-color:var(--play);color:#1a1206}
/* 검색 결과 줄의 ▶(여기부터 재생)·⋯(곡 메뉴), 결과 머리의 ⋯(결과 전체) — Musike 플레이어·메뉴 */
#results .ract{flex:none;display:flex;gap:2px;align-self:center}
#results .ract button{width:34px;height:34px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--mut);display:grid;place-items:center;font-size:15px;padding:0}
#results .ract button:hover{background:var(--solid);color:var(--acc)}
#results .ract [data-rp]{color:var(--acc)}
#results .sall{flex:none;margin:6px 8px 6px 0;border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:0 10px;font-size:12px;cursor:pointer;color:var(--fg);white-space:nowrap}
#results .sall:hover{border-color:var(--acc);color:var(--acc)}
@media (pointer:coarse){#results .ract button{width:42px;height:42px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ctl">
  <div id="top">
    <span class="brand">음악 지도</span>
    <input id="q" type="search" placeholder="곡·아티스트·분위기 검색 (예: 비 오는 날 재즈)" autocomplete="off" enterkeyhint="search">
    <button class="ib tagb" id="tagbtn" type="button" title="분위기·소리 태그" aria-label="분위기·소리 태그">#</button>
    <button class="ib cmdk" id="cmdk" type="button" title="설정·명령 (Ctrl+K)" aria-label="설정·명령" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6Z"/></svg><span>설정</span><kbd>Ctrl K</kbd></button>
    <button id="toggle" type="button" hidden aria-label="조작법"></button>
  </div>
  <div id="chips" aria-label="조건"></div>

let fly = null;
function flyTo(i) {
  const t = new THREE.Vector3().fromArray(dest, i * 3);

  off.setLength(Math.min(off.length(), 150));
  // 지도는 패널이 열려도 움직이지 않으므로, 날아갈 때만 고른 점이 패널을 뺀 영역 가운데 오게 카메라 중심을 옆으로 민다(데스크톱)

}

const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function pickAt(cx, cy) {
  mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  ray.params.Points.threshold = camera.position.distanceTo(controls.target) * (isTouch ? 0.03 : 0.014);
  const hits = ray.intersectObjects([cloud]).filter(h => (alpha[h.index] > 0.01 && visible[h.index]) || h.index === selected);
  if (!hits.length) return -1;
  hits.sort((a, b) => a.distanceToRay - b.distanceToRay || a.distance - b.distance);
  return hits[0].index;
}
// 손가락: 화면에서 반경 r(px) 안의 가장 가까운 점(겹치면 앞쪽)
function pickNear(cx, cy, r = 24) {
  let best = -1, bd = r * r, bz = 2;
  const test = (i, x, y, z) => {
    const dx = (x + 1) / 2 * innerWidth - cx, dy = (1 - y) / 2 * innerHeight - cy, d = dx * dx + dy * dy;
    if (d < bd - 4 || (d <= bd + 4 && z < bz)) { best = i; bd = Math.min(bd, d); bz = z; }
  };
  for (let i = 0; i < n; i++) {
    if ((alpha[i] <= 0.01 || !visible[i]) && i !== selected) continue;
    v3.fromArray(cur, i * 3).project(camera);
    if (v3.z <= 1) test(i, v3.x, v3.y, v3.z);
  }
  return best;
}
// 두 번 탭: 그 자리로 확대(점이 있으면 그 점, 없으면 손가락 밑 방향)
function zoomAt(cx, cy, i) {
  const t = controls.target.clone(), off = camera.position.clone().sub(t);
  let p;
  if (i >= 0) p = new THREE.Vector3().fromArray(cur, i * 3);
  else {
    mouse.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    p = ray.ray.at(off.length(), new THREE.Vector3());
  }
  t.lerp(p, i >= 0 ? 1 : 0.5);

}
const tip = $("tip");

const hideTip = () => { tip.style.display = "none"; };
let down = null, lastTap = null;
const fingers = new Set();

    if (down && e.button === 0 && performance.now() - down.t <= 350 && Math.hypot(e.clientX - down.x, e.clientY - down.y) <= 10) {

    }

  const d = down; down = null;

let hoverLbl = null;
function setHoverLbl(key) {

{ const qc = chips.find(c => c.k === "q"); if (qc && !$("q").value) { $("q").value = qc.v; $("q").dispatchEvent(new Event("input")); } }
applyTheme(THEME0 === "light" || THEME0 === "dark" ? THEME0 : null);
openFromHash();
renderer.setAnimationLoop(now => {
  stepAnim(now);
  if (fly) {
    controls.target.lerp(fly.t, 0.1); camera.position.lerp(fly.c, 0.1);
    dirty = true;
    if (controls.target.distanceTo(fly.t) < 0.05 && camera.position.distanceTo(fly.c) < 0.05) fly = null;
  }
  const moved = controls.update();
  if ((selected >= 0 || playing >= 0) && !reduceMotion.matches) dirty = true;  // 선택 표시의 숨쉬기·발광, 재생 맥박
  updateSelectedOverlay(now);
  updatePlayMark(now);
  if (mobile() && !moved && !dirty && !anim && !fly) return;  // 멈춘 화면은 다시 그리지 않는다(배터리)
  dirty = false;
  updateDepthRange();
  renderer.render(scene, camera);
  placeLabels();
});
if (document.fonts) document.fonts.ready.then(() => { dirty = true; });
window.dispatchEvent(new Event("mapready"));
