[project]
name = "musike-analysis"
version = "0.1.0"
description = "Musike 취향 분석 작업자: 곡 카드·소리/글 벡터·소리 묶음·3D 지도 (#26)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "umap-learn==0.5.12",
    "google-genai==2.33.0",
    "onnxruntime>=1.20",
    "tokenizers==0.21.4",
    "huggingface-hub==0.36.2",
    # 소리 벡터(RTX 3070, MuQ-MuLan)
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "transformers==4.49.0",
    "muq==0.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musike_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
